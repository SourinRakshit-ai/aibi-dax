name: Publish to PyPI

# Trusted publishing (OIDC): no token secret. The package must be a
# "Trusted Publisher" on pypi.org under owner SourinRakshit-ai, pointing
# at this workflow file and the environment below (see issue #3).
on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

environment:
  name: pypi
  url: https://pypi.org/p/aibi-dax

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
