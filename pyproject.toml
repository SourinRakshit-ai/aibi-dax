[project]
name = "aibi-dax"
version = "0.2.1"
description = "DAX expression analysis: complexity metrics, anti-pattern detection, per-model ranking"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sourin Rakshit" }]
keywords = ["dax", "powerbi", "analysis", "lint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/SourinRakshit-ai/aibi-dax"
Documentation = "https://sourinrakshit-ai.github.io/aibi-dax/"
Changelog = "https://github.com/SourinRakshit-ai/aibi-dax/blob/main/CHANGELOG.md"
Issues = "https://github.com/SourinRakshit-ai/aibi-dax/issues"

[project.scripts]
dxa = "aibi_dax.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]
docs = ["mkdocs-material"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
