# Pre-commit hooks: the three gates pytest/mypy/ruff, run before each commit.
# Install once:  `pip install pre-commit && pre-commit install`
# Run everywhere: `pre-commit run --all-files`

repos:
  - repo: local
    hooks:
      - id: pytest
        name: pytest (unit suite)
        entry: python3 -m pytest -q
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy --strict
        entry: python3 -m mypy --strict src/aibi_dax/
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff
        name: ruff
        entry: python3 -m ruff check src/ tests/
        language: system
        types: [python]
        pass_filenames: false
